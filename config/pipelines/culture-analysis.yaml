id: culture-analysis
command: /analyze-culture
description: "Org culture analysis with year-over-year comparison"

slackInput:
  type: channel_threads
  channelIds: [] # Configure with real Slack channel IDs before enabling this pipeline
  sampling:
    strategy: top_engaged # Score by reactions + replies to surface high-signal threads
    maxThreadsPerWeek: 5  # Per channel, per week. Increase for broader coverage.

stages:
  # Stage 1: Compress raw threads into weekly digests (not culture analysis yet)
  - id: weekly_digest
    unit: week
    prompt:
      system: |
        あなたはSlackスレッドから組織のシグナルを抽出する専門家です。
        文化的な解釈ではなく、事実に基づいた観察を記述してください。
        出力は必ず日本語で行ってください。
      user: |
        以下のSlackスレッドから、次の情報を抽出してください：
        - 主に議論されたトピック
        - コミュニケーションパターン（メンバー同士の関わり方）
        - 意思決定のポイントやアクションアイテム

        スレッド：
        {{input}}

  # Stage 2: Compress weekly digests into monthly summaries
  - id: monthly_digest
    unit: month
    inputSource: weekly_digest
    prompt:
      system: |
        あなたは週次ダイジェストを簡潔な月次サマリーに集約する専門家です。
        出力は必ず日本語で行ってください。
      user: |
        以下の週次ダイジェストを月次サマリーとして集約してください。
        コミュニケーションスタイル、主なトピック、パターンに関する重要なシグナルを保持してください。

        週次ダイジェスト：
        {{input}}

  # Stage 3: Analyze org culture from 12 months of data
  - id: yearly_culture
    unit: year
    inputSource: monthly_digest
    prompt:
      system: |
        あなたはコミュニケーションパターンを分析する組織文化の専門家です。
        月次データをもとに、その年の組織文化を特徴づけてください。
        出力は必ず日本語で行ってください。
      user: |
        12ヶ月分のSlackコミュニケーションデータをもとに、以下の項目を含むカルチャープロファイルを作成してください：

        ## コミュニケーションスタイル
        メンバーがどのようにコミュニケーションを取るか（直接的/間接的、フォーマル/カジュアル、非同期/同期の傾向）を説明してください。

        ## 意思決定パターン
        意思決定はどのように行われ、伝達されるか？誰が参加するか？

        ## コラボレーションの特徴
        メンバーはどのように協働するか？チームワークはどのような様子か？

        ## 実際の行動に表れる価値観
        表明された価値観ではなく、行動から見えてくる価値観は何か？

        ## 主要テーマ
        その年を通じて支配的だったトピックは何か？

        月次データ：
        {{input}}

  # Stage 4: Aggregate yearly_culture results across all years in the job.
  # Runs unconditionally — with a single year it produces a single-year profile;
  # with multiple years it produces a year-over-year comparison.
  - id: yoy_report
    unit: all_years
    inputSource: yearly_culture
    prompt:
      system: |
        あなたは組織文化の変化を専門とする専門家です。
        複数年にわたる文化の変化を特定してください。
        出力は必ず日本語で行ってください。
      user: |
        以下の年次カルチャープロファイルをもとに、年次比較分析を作成してください：

        ## 文化の軌跡
        組織文化全体はどのように変化してきたか？

        ## 主要な変化
        最も大きく変化した点は何か、またそれはいつ起きたか？

        ## 変わらない要素
        一貫して維持されている文化的側面は何か？

        ## 転換点
        文化的変化を促した特定の出来事や時期はあったか？

        ## 今後の展望
        これまでの軌跡から、どのような文化的パターンが今後も続くと考えられるか？

        年次カルチャープロファイル：
        {{input}}

output:
  destination: self_dm
  thread: false
  broadcastFinal: true
